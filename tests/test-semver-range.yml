name: Test semver range version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: '~0.97'
      - name: Assert version matches range 0.97.x
        run: |
          V="$(nu --version)"
          echo "nu version: $V"
          case "$V" in
            0.97.*) echo "PASS" ;;
            *) echo "FAIL: expected 0.97.x"; exit 1 ;;
          esac
