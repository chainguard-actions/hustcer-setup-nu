name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert nu is installed and runs
        run: |
          which nu || { echo "FAIL: nu not on PATH"; exit 1; }
          VERSION="$(nu --version)"
          echo "version: $VERSION"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "FAIL: unexpected version output"
            exit 1
          fi
          OUT="$(nu -c 'print (1 + 2)')"
          echo "output: $OUT"
          if [ "$OUT" != "3" ]; then
            echo "FAIL: expected 3"
            exit 1
          fi
          echo "PASS"
