name: Test basic usage - install latest nushell
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-nu
        uses: .
        with:
          version: '*'
      - name: Assert nu is installed and executable
        run: |
          echo "Checking nu is on PATH..."
          which nu || { echo "FAIL: nu not found on PATH"; exit 1; }
          echo "Checking nu version..."
          NU_VERSION=$(nu --version)
          echo "nu version: $NU_VERSION"
          if [ -z "$NU_VERSION" ]; then
            echo "FAIL: nu --version returned empty string"
            exit 1
          fi
          echo "PASS: nu is installed, version=$NU_VERSION"
      - name: Assert nu can run a simple command
        run: |
          RESULT=$(nu -c '"hello world"')
          echo "nu output: $RESULT"
          if [ "$RESULT" != "hello world" ]; then
            echo "FAIL: expected 'hello world', got '$RESULT'"
            exit 1
          fi
          echo "PASS"
