name: Test check-latest flag installs latest nushell
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-nu
        uses: .
        with:
          check-latest: true
          github-token: ${{ github.token }}
      - name: Assert nu is available on PATH
        run: |
          echo "Checking nu is on PATH..."
          if ! command -v nu >/dev/null 2>&1; then
            echo "FAIL: nu command not found on PATH"
            exit 1
          fi
          echo "PASS: nu is available"
      - name: Assert nu runs successfully with check-latest
        run: |
          NU_VERSION=$(nu --version)
          echo "nu version: $NU_VERSION"
          if [ -z "$NU_VERSION" ]; then
            echo "FAIL: nu --version returned empty output"
            exit 1
          fi
          echo "PASS: nu installed with check-latest, version is $NU_VERSION"
      - name: Assert nu can execute a script
        run: |
          RESULT=$(nu -c '"hello from nushell"')
          echo "nu script result: $RESULT"
          if [ "$RESULT" != "hello from nushell" ]; then
            echo "FAIL: expected 'hello from nushell' but got '$RESULT'"
            exit 1
          fi
          echo "PASS: nu script executed successfully"
