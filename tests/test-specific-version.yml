name: Test Nu setup with specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-nu
        uses: .
        with:
          version: '0.101.0'
          github-token: ${{ github.token }}
      - name: Assert nu is on PATH
        run: |
          echo "Checking nu is available..."
          which nu || { echo "FAIL: nu not found on PATH"; exit 1; }
          echo "PASS: nu found at $(which nu)"
      - name: Assert nu version matches requested version
        run: |
          echo "Running nu --version..."
          NU_VERSION=$(nu --version)
          echo "nu version: $NU_VERSION"
          if [ -z "$NU_VERSION" ]; then
            echo "FAIL: nu --version returned empty output"
            exit 1
          fi
          if echo "$NU_VERSION" | grep -q "0.101.0"; then
            echo "PASS: nu version matches 0.101.0"
          else
            echo "FAIL: expected version 0.101.0 but got $NU_VERSION"
            exit 1
          fi
