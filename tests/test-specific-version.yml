name: Test specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: '0.101.0'
      - name: Assert installed version
        run: |
          VERSION="$(nu --version)"
          echo "version: $VERSION"
          if [ "$VERSION" != "0.101.0" ]; then
            echo "FAIL: expected 0.101.0"
            exit 1
          fi
          echo "PASS"
